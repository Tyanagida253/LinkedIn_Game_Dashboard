<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minigame Standings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Instrument+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">

<main>
<header>
<h1>Minigame standings</h1>
<p class="sub">LinkedIn Queens, Tango, Zip and friends. The fastest time wins each puzzle each day, and ties share the win. A hint adds 60 seconds.</p>
<p class="sub" id="ust"></p>
</header>
<div class="filters" id="filters"></div>
<section aria-label="Wins by player"><div class="podium" id="podium"></div></section>
<section class="panel"><h2>Daily results</h2><div class="scroll" id="rg"></div></section>
<section class="panel"><h2>Standings</h2><div class="scroll" id="lb"></div></section>
<section class="panel">
<div class="panel-h"><h2>Time trend</h2><label>Game <select id="cg"></select></label></div>
<div id="chart"></div>
</section>
<section class="panel"><h2>Recent scores</h2><div class="scroll" id="log"></div></section>
</main>

<script src="shared.js"></script>
<script>
let scores=[],chartGame=null,first=true;

function render(){
  const rows=applyFilters(scores),rr=ranked(rows),by=p=>rr.filter(r=>r.player===p);
  const st=PLAYERS.map(p=>({p,...stats(by(p))})).sort((a,b)=>b.wins-a.wins||(a.pos??99)-(b.pos??99)||(a.avg??1e9)-(b.avg??1e9));

  // podium: column height follows wins
  const top=Math.max(1,...st.map(s=>s.wins));
  $("podium").replaceChildren(...st.map(s=>{
    const a=el("a",null,"pod");a.href=playerHref(s.p);a.style.setProperty("--c",pc(s.p));
    a.style.setProperty("--h",(130+110*s.wins/top)+"px");
    const n=el("div",s.wins,"pod-n");n.append(el("small",s.wins===1?"win":"wins"));
    const m=el("div",null);m.append(el("div",s.p,"pod-name"),el("div",s.n?(s.rate==null?"No head-to-head yet":Math.round(100*s.rate)+"% win rate, "+s.pos.toFixed(1)+" avg position"):"No scores in range","pod-meta"));
    a.append(n,m);return a}));

  resultsGrid(rr);

  table($("lb"),["Player","Wins","Played","Win rate","Avg position","Avg time","Best","Streak"],
    st.filter(s=>s.n).map(s=>[who(s.p,true),s.wins,s.n,s.rate==null?NONE:Math.round(100*s.rate)+"%",s.pos==null?NONE:s.pos.toFixed(2),fmt(s.avg),fmt(s.best),s.cur+"d"]),EMPTY);

  // chart game picker follows the game filter
  const gs=GAMES.filter(g=>filters.games.has(g));
  if(!gs.includes(chartGame))chartGame=[...gs].sort((a,b)=>rows.filter(r=>r.game===b).length-rows.filter(r=>r.game===a).length)[0];
  const sel=$("cg");sel.replaceChildren(...gs.map(g=>{const o=el("option",g);o.value=g;return o}));sel.value=chartGame;
  sel.onchange=()=>{chartGame=sel.value;chart(rows)};
  chart(rows);

  const recent=[...rows].sort((a,b)=>b.date.localeCompare(a.date)||a.game.localeCompare(b.game)||eff(a)-eff(b)).slice(0,25);
  table($("log"),["Date","Game","Player","Time"],recent.map(s=>{
    const t=el("span",fmt(s.timeSeconds));if(s.hints)t.append(el("span"," + "+HINT_PENALTY+"s hint = "+fmt(eff(s)),"hint"));
    return[s.date,s.game,who(s.player,true),t]}),EMPTY,3);
  $("log").querySelectorAll("td:last-child,th:last-child").forEach(c=>{c.classList.remove("n")});
}

function resultsGrid(rr){
  const host=$("rg"),days=[...new Set(rr.map(r=>r.date))].sort(),gs=GAMES.filter(g=>filters.games.has(g));
  host.replaceChildren();
  if(!days.length){host.append(el("p",EMPTY,"empty"));return}
  const g=el("div",null,"rg"+(first?" reveal":""));g.style.setProperty("--days",days.length);
  g.append(el("span"));
  days.forEach(d=>g.append(el("span",dlabel(day(d)),"rg-h")));
  PLAYERS.forEach(p=>{
    const n=el("span",null,"rg-n");n.append(who(p,true));g.append(n);
    days.forEach((d,i)=>{
      const c=el("div",null,"cl");c.style.setProperty("--cols",Math.min(3,gs.length));
      gs.forEach(game=>{const t=tile(rr.find(r=>r.player===p&&r.date===d&&r.game===game),game);t.style.setProperty("--i",i);c.append(t)});
      g.append(c)});
  });
  host.append(g,rankLegend(),el("p","Tiles run left to right, then down, in this order: "+gs.join(", ")+". The number is the finishing position that day.","order"));
  host.scrollLeft=host.scrollWidth;
  first=false;
}

function chart(rows){
  const mine=rows.filter(s=>s.game===chartGame);
  lineChart($("chart"),PLAYERS.map(p=>({name:p,color:pc(p),
    pts:mine.filter(s=>s.player===p).map(s=>({x:day(s.date),y:eff(s),tip:`${p}, ${s.date}: ${fmt(eff(s))}${s.hints?" (with hint)":""}`}))})).filter(s=>s.pts.length),
    "Times by date per player for "+chartGame);
}

filterBar($("filters"),render);
render();
loadData().then(d=>{scores=d.scores;$("ust").textContent="Last updated "+new Date(d.updatedAt).toLocaleString();first=true;render()})
  .catch(()=>$("ust").textContent=LOAD_ERR);
</script>
